<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="icon" type="image/png" href="assets/favicon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="assets/favicon-light.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="assets/favicon-light.png">
  <title>{listingAddress}</title>
  <link rel="canonical" href="{listingPageUrl}">
  <meta property="og:url" content="{listingPageUrl}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{listingAddress}">
  <meta property="og:description" content="Photos and Property Details for {listingAddress}. Get complete property information, maps, street view, schools, walk score and more.">
  <meta property="og:image" content="{listingPhotoUrl}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{listingAddress}">
  <meta name="twitter:description" content="Photos and Property Details for {listingAddress}. Get complete property information, maps, street view, schools, walk score and more.">
  <meta name="twitter:image" content="{listingPhotoUrl}">
  <meta name="description" content="Photos and Property Details for {listingAddress}. Get complete property information, maps, street view, schools, walk score and more.">
  <meta name="keywords" content="{listingAddress}, {listingCity} Real Estate, {listingCity} Property for Sale">
  <script src="https://kestrel.idxhome.com/ihf-kestrel.js"></script>
  <script>
    window.ihfKestrel = window.ihfKestrel || {};
    ihfKestrel.config = {
      platform: "custom",
      activationToken: "84ee0119-74ff-4a71-885e-a3cc7e030850",
    };
  </script>
  <link rel="stylesheet" href="_ds/realty-hub-design-system-dc2b1855-61ad-4be7-8677-8c19514f7cae/styles.css">
  <script>
    (function loadDsBundle() {
      if (window.React) {
        var s = document.createElement('script');
        s.src = '_ds/realty-hub-design-system-dc2b1855-61ad-4be7-8677-8c19514f7cae/_ds_bundle.js';
        document.head.appendChild(s);
      } else {
        setTimeout(loadDsBundle, 10);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Lexend:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rh-font: 'Montserrat', system-ui, sans-serif;
      --rh-accent: #1a1a1a;
      --rh-accent-hover: #000000;
      --rh-accent-light: #ededed;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--rh-bg); letter-spacing: 0.015em; }
    @keyframes modal-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modal-fade-out { from { opacity: 1; } to { opacity: 0; } }
    a { color: var(--rh-accent); text-decoration: none; }
    a:hover { color: var(--rh-accent-hover); }
  </style>
</helmet>

<div style="font-family: var(--rh-font); color: var(--rh-text-primary); background: var(--rh-bg); width: 100%; height: 100vh; overflow: hidden; display: flex; flex-direction: column;">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 0 clamp(20px, 4vw, 48px) 0 clamp(8px, 1.5vw, 18px); height: 92px; background: #000000; flex-wrap: wrap; flex-shrink: 0;">
    <a href="../" style="display: flex; align-items: center; flex-shrink: 0;">
      <img src="uploads/JKR-key-white.png" alt="Jackson Kesecker Realtor" style="height: 34px; width: auto;">
    </a>
    <div style="display: flex; align-items: center; gap: clamp(14px, 2.4vw, 26px); flex: 1; padding-left: clamp(16px, 3vw, 40px);">
      <a href="../listings" style="font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.75);" style-hover="color: #ffffff;">Search</a>
      <span style="font-size: 30px; line-height: 1; display: flex; align-items: center; color: #ffffff;">•</span>
      <a href="../#idx" style="font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.75);" style-hover="color: #ffffff;">Notable Sales</a>
      <span style="font-size: 30px; line-height: 1; display: flex; align-items: center; color: #ffffff;">•</span>
      <a href="../#neighborhoods" style="font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.75);" style-hover="color: #ffffff;">Areas</a>
      <span style="font-size: 30px; line-height: 1; display: flex; align-items: center; color: #ffffff;">•</span>
      <a href="../#about" style="font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.75);" style-hover="color: #ffffff;">About</a>
    </div>
    <a href="#" onClick="{{ openContactModal }}" style="font-size: 13px; font-weight: 600; color: #ffffff; flex-shrink: 0;">Contact</a>
    <dc-import name="ContactModal" hint-size="0,0"></dc-import>
  </div>

  <div style="flex: 1; overflow-y: auto;">
    <div id="ihf-listing-detail" ref="{{ ihfListingDetailRef }}" style="width: 100%; min-height: 100%; padding: 24px 36px; box-sizing: border-box;"></div>
  </div>

  <sc-if value="{{ isPhoneOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ onPhoneClose }}" style="position: fixed; inset: 0; z-index: 299; background: transparent;"></div>
  </sc-if>
  <div style="position: fixed; right: 24px; bottom: 24px; z-index: 300; width: 56px; height: 56px;">
    <div style="{{ phonePopoverStyle }} position: absolute; right: 0; bottom: 70px; width: 260px; background: #141414; border: 1px solid rgba(255,255,255,0.12); border-radius: 4px; padding: 20px; box-shadow: 0 12px 32px rgba(0,0,0,0.4);">
      <div style="display: flex; justify-content: flex-end;"><span onClick="{{ onPhoneClose }}" style="color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1; cursor: pointer;">✕</span></div>
      <p style="font-size: 20px; font-weight: 600; color: #ffffff; text-align: center; margin: -8px 0 4px;">Questions?</p>
      <p style="font-size: 14px; color: rgba(255,255,255,0.85); text-align: center; margin: 0 0 12px;">Call or text today, we are here to help!</p>
      <p style="margin: 0 0 16px; text-align: center;"><a href="tel:+18318210398" style="font-size: 22px; font-weight: 700; color: #ffffff; text-decoration: none;">(831) 821-0398</a></p>
      <p style="font-size: 11px; line-height: 1.6; color: rgba(255,255,255,0.55); text-align: center; margin: 0;">I agree to be contacted by Jackson Kesecker via text, call &amp; email.</p>
    </div>
    <button onClick="{{ togglePhonePopup }}" aria-label="Call or text" style="width: 56px; height: 56px; border-radius: 50%; background: #1a1a1a; color: #ffffff; border: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.3);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
    </button>
  </div>

  <dc-import name="AccessibilityWidget" hint-size="56px,56px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { isPhoneOpen: false };
  _ihfFixCase = (text) => {
    const m = text.match(/,\s*([A-Za-z]{2})\s*\d{5}/);
    const state = m ? m[1].toUpperCase() : null;
    let result = text.toLowerCase().replace(/\b[a-z]/g, (c) => c.toUpperCase());
    if (state) result = result.replace(/\b[A-Za-z]{2}\b(?=\s*\d{5})/, state);
    return result;
  };
  _ihfFixAllShadowRoots = () => {
    document.querySelectorAll('*').forEach((el) => {
      if (!el.shadowRoot) return;
      el.shadowRoot.querySelectorAll('.ihf-gallery-street-name').forEach((wrap) => {
        const p = wrap.querySelector('p') || wrap;
        const fixed = this._ihfFixCase(p.textContent);
        if (p.textContent !== fixed) p.textContent = fixed;
      });
      const walker = document.createTreeWalker(el.shadowRoot, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        if (node.nodeValue.includes('Sold Price:')) node.nodeValue = node.nodeValue.replace('Sold Price:', '').trim();
      }
    });
  };
  _ihfStartCaseFix = () => {
    if (this._ihfCaseFixStarted) return;
    this._ihfCaseFixStarted = true;
    let ticks = 0;
    const iv = setInterval(() => {
      ticks++;
      this._ihfFixAllShadowRoots();
      if (ticks > 60) clearInterval(iv);
    }, 500);
  };
  ihfListingDetailRef = (node) => {
    if (!node || node.dataset.ihfMounted) return;
    const mount = () => {
      if (!window.ihfKestrel || !window.ihfKestrel.render) { setTimeout(mount, 150); return; }
      node.dataset.ihfMounted = '1';
      node.appendChild(window.ihfKestrel.render());
      this._ihfStartCaseFix();
    };
    mount();
  };
  openContactModal = (e) => { if (e) e.preventDefault(); if (window.openKeseckerContactModal) window.openKeseckerContactModal(); };
  togglePhonePopup = () => this.setState(s => ({ isPhoneOpen: !s.isPhoneOpen }));
  onPhoneClose = () => this.setState({ isPhoneOpen: false });
  renderVals() {
    return {
      ihfListingDetailRef: this.ihfListingDetailRef,
      openContactModal: this.openContactModal,
      isPhoneOpen: this.state.isPhoneOpen, togglePhonePopup: this.togglePhonePopup, onPhoneClose: this.onPhoneClose,
      phonePopoverStyle: this.state.isPhoneOpen ? 'opacity:1;visibility:visible;transform:translateY(0);transition:opacity 0.3s ease,transform 0.3s ease;' : 'opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity 0.3s ease,transform 0.3s ease;',
    };
  }
}

</script>
</body>
</html>
